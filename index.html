
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at center, #071d36, #02050c 70%);
  color: #dff8ff;
  font-family: Arial, sans-serif;
  text-align: center;
}

header {
  padding: 22px 10px 5px;
  color: #43d9ff;
  letter-spacing: 5px;
  font-size: 25px;
}

#estado {
  color: #80cfff;
  font-size: 13px;
  margin: 8px;
}

.esfera {
  width: 155px;
  height: 155px;
  margin: 25px auto;
  border-radius: 50%;
  border: 3px solid #35d9ff;
  box-shadow: 0 0 20px #00aaff, inset 0 0 25px #008cff;
  background: radial-gradient(circle, #46dfff 0%, #0754a0 30%, #020814 72%);
  animation: pulso 2s infinite alternate;
}

@keyframes pulso {
  from { box-shadow: 0 0 12px #00aaff, inset 0 0 15px #008cff; }
  to { box-shadow: 0 0 35px #00cfff, inset 0 0 30px #008cff; }
}

#chat {
  width: 92%;
  max-width: 520px;
  height: 260px;
  overflow-y: auto;
  margin: 15px auto;
  padding: 12px;
  border: 1px solid #176b91;
  border-radius: 12px;
  background: rgba(0, 10, 24, 0.85);
  text-align: left;
}

.mensaje {
  margin: 10px 0;
  padding: 10px;
  border-radius: 8px;
  overflow-wrap: anywhere;
  line-height: 1.4;
}

.usuario {
  background: #103b59;
  color: #ffffff;
}

.jarvis {
  background: #092b30;
  color: #71f5ff;
}

form {
  display: flex;
  gap: 7px;
  width: 92%;
  max-width: 520px;
  margin: 10px auto;
}

input {
  flex: 1;
  min-width: 0;
  padding: 13px;
  border-radius: 9px;
  border: 1px solid #1689b7;
  background: #061321;
  color: white;
  font-size: 16px;
}

button {
  padding: 12px;
  border: 1px solid #39cfff;
  border-radius: 9px;
  background: #073a5b;
  color: white;
  font-size: 14px;
}

button:active { background: #087aa5; }

.controles {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 8px;
}

.pie {
  padding: 15px;
  color: #6598b6;
  font-size: 12px;
}
</style>
</head>

<body>
<header>J.A.R.V.I.S.</header>
<div id="estado">ASISTENTE EN LÍNEA</div>

<div class="esfera"></div>

<div id="chat" aria-live="polite">
  <div class="mensaje jarvis">
    JARVIS: Hola. Estoy listo para ayudarte. Escribe un mensaje o pulsa Hablar.
  </div>
</div>

<form id="formulario">
  <input id="entrada" type="text"
    placeholder="Escribe aquí..." autocomplete="off" required>
  <button type="submit">Enviar</button>
</form>

<div class="controles">
  <button id="microfono" type="button">🎙️ Hablar</button>
  <button id="voz" type="button">🔊 Probar voz</button>
  <button id="limpiar" type="button">🗑️ Limpiar</button>
</div>

<div class="pie">JARVIS PERSONAL · VERSIÓN INICIAL</div>

<script>
(function () {
  var formulario = document.getElementById("formulario");
  var entrada = document.getElementById("entrada");
  var chat = document.getElementById("chat");
  var estado = document.getElementById("estado");
  var microfono = document.getElementById("microfono");
  var voz = document.getElementById("voz");
  var limpiar = document.getElementById("limpiar");
  var vozActiva = true;

  function agregar(texto, clase) {
    var mensaje = document.createElement("div");
    mensaje.className = "mensaje " + clase;
    mensaje.textContent = texto;
    chat.appendChild(mensaje);
    chat.scrollTop = chat.scrollHeight;
  }

  function hablar(texto) {
    if (!vozActiva) return;

    if (!("speechSynthesis" in window)) {
      estado.textContent = "VOZ NO DISPONIBLE EN ESTE NAVEGADOR";
      return;
    }

    window.speechSynthesis.cancel();

    var mensajeVoz = new SpeechSynthesisUtterance(texto);
    mensajeVoz.lang = "es-MX";
    mensajeVoz.rate = 0.95;
    mensajeVoz.pitch = 0.9;
    mensajeVoz.volume = 1;

    mensajeVoz.onstart = function () {
      estado.textContent = "JARVIS ESTÁ HABLANDO";
    };

    mensajeVoz.onend = function () {
      estado.textContent = "ASISTENTE EN LÍNEA";
    };

    mensajeVoz.onerror = function () {
      estado.textContent = "REVISA LA CONFIGURACIÓN DE VOZ DEL TELÉFONO";
    };

    window.speechSynthesis.speak(mensajeVoz);
  }

  function responder(texto) {
    var t = texto.toLowerCase().trim();

    if (/hola|buenas|buenos días|buenas tardes|buenas noches/.test(t)) {
      return "Hola. Soy JARVIS, tu asistente personal. ¿En qué puedo ayudarte?";
    }

    if (/cómo te llamas|quién eres|tu nombre/.test(t)) {
      return "Me llamo JARVIS. Soy tu asistente personal en desarrollo.";
    }

    if (/qué puedes hacer|ayuda|comandos/.test(t)) {
      return "Puedo conversar con comandos básicos, decirte la hora y hablar usando la voz del navegador.";
    }

    if (/hora/.test(t)) {
      return "Son las " + new Date().toLocaleTimeString("es-MX", {
        hour: "2-digit", minute: "2-digit"
      }) + ".";
    }

    if (/fecha|día es hoy/.test(t)) {
      return "Hoy es " + new Date().toLocaleDateString("es-MX", {
        weekday: "long", year: "numeric",
        month: "long", day: "numeric"
      }) + ".";
    }

    if (/gracias/.test(t)) {
      return "De nada. Estoy aquí para ayudarte.";
    }

    if (/adiós|hasta luego/.test(t)) {
      return "Hasta luego. JARVIS queda a tu disposición.";
    }

    return "He recibido tu mensaje: " + texto +
      ". Todavía estoy aprendiendo y aún no tengo una inteligencia artificial conectada.";
  }

  formulario.addEventListener("submit", function (evento) {
    evento.preventDefault();

    var texto = entrada.value.trim();
    if (!texto) return;

    agregar("TÚ: " + texto, "usuario");
    entrada.value = "";

    var respuesta = responder(texto);
    agregar("JARVIS: " + respuesta, "jarvis");
    hablar(respuesta);
  });

  voz.addEventListener("click", function () {
    vozActiva = true;
    hablar("Hola. Soy JARVIS. La prueba de voz funciona.");
  });

  microfono.addEventListener("click", function () {
    var Reconocimiento =
      window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!Reconocimiento) {
      estado.textContent = "RECONOCIMIENTO DE VOZ NO DISPONIBLE";
      agregar("JARVIS: Tu navegador no permite usar el micrófono por voz. Puedes escribir tus mensajes.", "jarvis");
      return;
    }

    var reconocimiento = new Reconocimiento();
    reconocimiento.lang = "es-MX";
    reconocimiento.continuous = false;
    reconocimiento.interimResults = false;

    reconocimiento.onstart = function () {
      estado.textContent = "TE ESTOY ESCUCHANDO...";
      microfono.textContent = "🎙️ Escuchando";
    };

    reconocimiento.onresult = function (evento) {
      entrada.value = evento.results[0][0].transcript;
      formulario.requestSubmit();
    };

    reconocimiento.onerror = function () {
      estado.textContent = "NO SE PUDO USAR EL MICRÓFONO";
      agregar("JARVIS: Revisa el permiso del micrófono en Chrome.", "jarvis");
    };

    reconocimiento.onend = function () {
      microfono.textContent = "🎙️ Hablar";
      if (estado.textContent === "TE ESTOY ESCUCHANDO...") {
        estado.textContent = "ASISTENTE EN LÍNEA";
      }
    };

    try {
      reconocimiento.start();
    } catch (error) {
      estado.textContent = "VUELVE A PULSAR HABLAR";
    }
  });

  limpiar.addEventListener("click", function () {
    chat.innerHTML = "";
    agregar("JARVIS: Chat limpio. Estoy listo para ayudarte.", "jarvis");
  });
})();
</script>
</body>
</html>
