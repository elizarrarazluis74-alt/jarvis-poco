
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030711">
<title>J.A.R.V.I.S.</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(ellipse at center, #071b35, #02050c 70%);
  color: #d8f4ff;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
}

header {
  width: 100%;
  padding: 24px 12px 8px;
  text-align: center;
  letter-spacing: 5px;
}

header h1 {
  margin: 0;
  color: #4bdcff;
  font-size: 28px;
  text-shadow: 0 0 18px #008cff;
}

header p {
  color: #719ebd;
  font-size: 11px;
  letter-spacing: 3px;
}

.orb {
  width: 190px;
  height: 190px;
  margin: 24px auto;
  border-radius: 50%;
  display: grid;
  place-items: center;
  position: relative;
  background: radial-gradient(circle, #4beaff 0%, #0875bd 15%,
              #041b38 42%, #020711 68%);
  box-shadow: 0 0 25px #007dff, inset 0 0 25px #00c8ff;
  animation: pulse 3s ease-in-out infinite;
}

.orb::before, .orb::after {
  content: "";
  position: absolute;
  inset: -12px;
  border: 2px solid #19baff;
  border-radius: 50%;
  box-shadow: 0 0 15px #008cff;
  animation: spin 8s linear infinite;
}

.orb::after {
  inset: -23px;
  border-color: #1269a9;
  border-style: dashed;
  animation-direction: reverse;
  animation-duration: 15s;
}

.orb span {
  font-size: 12px;
  letter-spacing: 3px;
  color: white;
  text-shadow: 0 0 12px #00bfff;
}

@keyframes pulse {
  50% { transform: scale(1.04); filter: brightness(1.3); }
}
@keyframes spin { to { transform: rotate(360deg); } }

#status {
  min-height: 24px;
  margin: 16px;
  color: #4bdcff;
  text-align: center;
  font-size: 13px;
}

main {
  width: min(92%, 520px);
  margin-bottom: 28px;
}

#chat {
  height: 230px;
  overflow-y: auto;
  padding: 14px;
  border: 1px solid #15547a;
  border-radius: 12px;
  background: #030b16dd;
  box-shadow: 0 0 20px #0077bb22;
}

.msg {
  padding: 10px 12px;
  margin: 8px 0;
  border-radius: 9px;
  line-height: 1.5;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.user {
  background: #073457;
  text-align: right;
}

.bot {
  background: #091a2b;
  border-left: 2px solid #19caff;
}

form { display: flex; gap: 8px; margin-top: 12px; }

input {
  flex: 1;
  min-width: 0;
  padding: 13px;
  border: 1px solid #17658e;
  border-radius: 8px;
  background: #061322;
  color: white;
  font-size: 16px;
  outline: none;
}

button {
  padding: 12px 15px;
  border: 1px solid #29cfff;
  border-radius: 8px;
  background: #06304b;
  color: #e3faff;
  font-size: 14px;
  cursor: pointer;
}

button:disabled { opacity: .5; }

.controls {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 10px;
}

footer {
  color: #587b96;
  font-size: 11px;
  text-align: center;
  padding: 10px 20px 25px;
}
</style>
</head>

<body>
<header>
  <h1>J.A.R.V.I.S.</h1>
  <p>ASISTENTE PERSONAL</p>
</header>

<div class="orb"><span>JARVIS</span></div>
<div id="status">SISTEMA INICIADO</div>

<main>
  <div id="chat" aria-live="polite">
    <div class="msg bot">Hola. Soy JARVIS. Estoy listo para ayudarte.</div>
  </div>

  <form id="form">
    <input id="mensaje" placeholder="Escribe un mensaje..."
           autocomplete="off" aria-label="Tu mensaje" required>
    <button id="enviar" type="submit">Enviar</button>
  </form>

  <div class="controls">
    <button id="microfono" type="button">🎙 Hablar</button>
    <button id="voz" type="button">🔊 Voz: activada</button>
    <button id="limpiar" type="button">Limpiar chat</button>
  </div>
</main>

<footer>
  J.A.R.V.I.S. · PROYECTO PERSONAL · VERSIÓN 1.0
</footer>

<script>
"use strict";

/* Servidor de Cloudflare configurado */
const SERVIDOR =
  "https://holy-waterfall-652d.elizarrarazluis80.workers.dev";

const chat = document.getElementById("chat");
const form = document.getElementById("form");
const entrada = document.getElementById("mensaje");
const enviar = document.getElementById("enviar");
const estado = document.getElementById("status");
const botonVoz = document.getElementById("voz");

let vozActiva = true;
let reconocimiento = null;

function agregarMensaje(texto, tipo) {
  const elemento = document.createElement("div");
  elemento.className = "msg " + tipo;
  elemento.textContent = texto;
  chat.appendChild(elemento);
  chat.scrollTop = chat.scrollHeight;
}

function hablar(texto) {
  if (!vozActiva || !("speechSynthesis" in window)) return;

  window.speechSynthesis.cancel();
  const mensajeVoz = new SpeechSynthesisUtterance(texto);
  mensajeVoz.lang = "es-MX";
  mensajeVoz.rate = 1;
  window.speechSynthesis.speak(mensajeVoz);
}

function respuestaLocal(texto) {
  const t = texto.toLowerCase().normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");

  if (t.includes("hola") || t.includes("buenas"))
    return "¡Hola! Soy JARVIS. Estoy funcionando correctamente.";

  if (t.includes("como te llamas") || t.includes("quien eres"))
    return "Soy JARVIS, tu asistente personal en desarrollo.";

  if (t.includes("que puedes hacer") || t.includes("ayuda"))
    return "Puedo conversar, responder algunas preguntas básicas y usar voz. Mi inteligencia avanzada aún está pendiente.";

  if (t.includes("hora"))
    return "La hora actual de tu dispositivo es " +
      new Date().toLocaleTimeString("es-MX", {
        hour: "2-digit", minute: "2-digit"
      }) + ".";

  if (t.includes("fecha") || t.includes("dia es"))
    return "Hoy es " + new Date().toLocaleDateString("es-MX",
      { dateStyle: "full" }) + ".";

  return "Recibí tu mensaje: " + texto +
    ". Mi inteligencia artificial avanzada aún no está conectada.";
}

async function preguntarAlServidor(texto) {
  const controlador = new AbortController();
  const temporizador = setTimeout(() => controlador.abort(), 7000);

  try {
    const respuesta = await fetch(SERVIDOR, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mensaje: texto }),
      signal: controlador.signal
    });

    if (!respuesta.ok) throw new Error("Servidor no disponible");

    const datos = await respuesta.json();

    if (typeof datos.respuesta !== "string")
      throw new Error("Respuesta del servidor inválida");

    return datos.respuesta;
  } finally {
    clearTimeout(temporizador);
  }
}

form.addEventListener("submit", async function(evento) {
  evento.preventDefault();

  const texto = entrada.value.trim();
  if (!texto || enviar.disabled) return;

  agregarMensaje(texto, "user");
  entrada.value = "";
  enviar.disabled = true;
  estado.textContent = "PROCESANDO SOLICITUD...";

  try {
    let respuesta;

    try {
      respuesta = await preguntarAlServidor(texto);
      estado.textContent = "SERVIDOR CONECTADO";
    } catch (error) {
      respuesta = respuestaLocal(texto);
      estado.textContent = "MODO LOCAL · SERVIDOR NO DISPONIBLE";
    }

    agregarMensaje(respuesta, "bot");
    hablar(respuesta);
  } catch (error) {
    agregarMensaje("Ocurrió un error. Intenta de nuevo.", "bot");
    estado.textContent = "ERROR";
  } finally {
    enviar.disabled = false;
    entrada.focus();
  }
});

botonVoz.addEventListener("click", function() {
  const APIReconocimiento =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!APIReconocimiento) {
    estado.textContent =
      "Tu navegador no admite dictado por voz. Usa el teclado.";
    return;
  }

  if (reconocimiento) {
    reconocimiento.stop();
    reconocimiento = null;
    return;
  }

  reconocimiento = new APIReconocimiento();
  reconocimiento.lang = "es-MX";
  reconocimiento.interimResults = false;
  reconocimiento.maxAlternatives = 1;

  reconocimiento.onstart = () => estado.textContent = "ESCUCHANDO...";
  reconocimiento.onresult = (evento) => {
    entrada.value = evento.results[0][0].transcript;
    form.requestSubmit();
  };
  reconocimiento.onerror = () => {
    estado.textContent = "No se pudo usar el micrófono.";
  };
  reconocimiento.onend = () => reconocimiento = null;

  try {
    reconocimiento.start();
  } catch (error) {
    reconocimiento = null;
    estado.textContent = "No se pudo iniciar el micrófono.";
  }
});

botonVoz.addEventListener("contextmenu", (evento) =>
  evento.preventDefault()
);

vozActiva = true;
botonVoz.title = "Pulsa para hablar";

document.getElementById("voz").addEventListener("click", function() {
  vozActiva = !vozActiva;
  this.textContent = vozActiva ? "🔊 Voz: activada" : "🔇 Voz: apagada";
  if (!vozActiva && "speechSynthesis" in window)
    window.speechSynthesis.cancel();
});

document.getElementById("limpiar").addEventListener("click", function() {
  chat.replaceChildren();
  agregarMensaje("Chat limpio. Soy JARVIS y estoy listo.", "bot");
});

entrada.focus();
</script>
</body>
</html>
